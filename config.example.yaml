# 登录态：python -m qwat.capture --login 生成，之后全程复用
state_file: state.json
done_file: done.json

# 拍照签到的照片（手机拍一张教室照最稳；也可每节课单独覆盖）
photo: photo.jpg
jitter_m: 0          # 想在围栏内随机漂移就填 3~5

# 课表：weekday 1=周一。lat/lng 可留空 —— 会自动用服务端 /api/v1/buildings
