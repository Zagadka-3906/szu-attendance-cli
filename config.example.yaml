# 以下为虚构课程与教室，使用前替换为自己的课表，不要提交真实配置。
courses:
  - name: "示例课程A"
    weekday: 1
    start: "09:00"
    end: "10:00"
    room: "示例教学楼A-101"
    # lat: 22.5377
    # lng: 113.935
    window_before: 20
    window_after: 30

  - name: "示例课程B"
    weekday: 3
    start: "14:00"
